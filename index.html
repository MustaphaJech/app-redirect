<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chouf Remote Expert Portal</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #status { font-size: 14px; margin-bottom: 15px; color: #aaa; }
        #viewport { width: 640px; height: 360px; border: 2px solid #333; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #controls { margin-top: 15px; display: flex; gap: 10px; width: 640px; }
        input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; }
        button { padding: 10px 16px; border: none; border-radius: 4px; background: #1a73e8; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
    <!-- PeerJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <h2>Chouf Expert Control Portal</h2>
    <div id="status">Status: Initializing PeerJS...</div>

    <div id="viewport" onclick="handleClick(event)">
        <video id="remote-video" autoplay playsinline muted></video>
    </div>

    <div id="controls">
        <input type="text" id="cmd-input" placeholder="Type instructions here..." onkeydown="if(event.key==='Enter') sendText()" disabled />
        <button id="btn-send" onclick="sendText()" disabled>Send</button>
        <button id="btn-clear" onclick="sendClear()" disabled>Clear</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const cmdInput = document.getElementById('cmd-input');
        const sendBtn = document.getElementById('btn-send');
        const clearBtn = document.getElementById('btn-clear');
        
        let peer = null;
        let conn = null;
        const targetPeerId = 'chouf-wearable-device';

        window.addEventListener('load', () => {
            // Initialize PeerJS client with explicit secure flag for GitHub Pages
            peer = new Peer('chouf-remote-expert', {
                debug: 2,
                secure: true
            });

            peer.on('open', (id) => {
                statusEl.innerText = "Status: Connected to signaling. Dialing wearable (ID: " + targetPeerId + ")...";
                connectToWearable();
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                statusEl.innerText = "Status Error: " + err.type;
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (stream) => {
                    const video = document.getElementById('remote-video');
                    video.srcObject = stream;
                    video.play();
                });
            });
        });

        function connectToWearable() {
            conn = peer.connect(targetPeerId);

            conn.on('open', () => {
                statusEl.innerText = "Status: Direct Link Active!";
                cmdInput.disabled = false;
                sendBtn.disabled = false;
                clearBtn.disabled = false;
            });

            conn.on('close', () => {
                statusEl.innerText = "Status: Wearable disconnected. Retrying in 3s...";
                cmdInput.disabled = true;
                sendBtn.disabled = true;
                clearBtn.disabled = true;
                setTimeout(connectToWearable, 3000);
            });
        }

        function sendCommand(obj) {
            if (conn && conn.open) {
                conn.send(JSON.stringify(obj));
            }
        }

        function handleClick(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = Math.round(((e.clientX - rect.left) / rect.width) * 1280);
            const y = Math.round(((e.clientY - rect.top) / rect.height) * 720);
            sendCommand({ type: 'draw_circle', x: x, y: y });
        }

        function sendText() {
            const txt = cmdInput.value.trim();
            if (txt) {
                sendCommand({ type: 'text', payload: txt });
                cmdInput.value = '';
            }
        }

        function sendClear() {
            sendCommand({ type: 'clear' });
        }
    </script>
</body>
</html>
