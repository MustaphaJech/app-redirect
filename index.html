<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chouf Remote Expert Portal (P2P)</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 20px; 
        }
        h2 { margin-bottom: 5px; color: #1a73e8; }
        #status { font-size: 14px; margin-bottom: 15px; color: #888; font-weight: 500; }
        #container { display: flex; flex-direction: column; align-items: center; max-width: 640px; width: 100%; }
        #viewport-container { 
            position: relative; 
            width: 640px; 
            height: 360px; 
            border: 2px solid #333; 
            border-radius: 8px; 
            overflow: hidden; 
            cursor: crosshair; 
            background: #000; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        #input-panel { width: 100%; display: flex; margin-top: 15px; gap: 10px; }
        input { 
            flex-grow: 1; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #444; 
            background: #222; 
            color: #fff; 
            font-size: 15px; 
        }
        button { 
            padding: 12px 18px; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
            transition: background 0.2s;
        }
        .btn-send { background: #1a73e8; color: white; }
        .btn-send:hover { background: #1557b0; }
        .btn-clear { background: #3c4043; color: white; }
        .btn-clear:hover { background: #5f6368; }
        .btn-end { background: #d93025; color: white; }
        .btn-end:hover { background: #b31412; }
        button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
    <!-- PeerJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="container">
        <h2>Chouf Expert Control Portal</h2>
        <div id="status">Initializing PeerJS Matchmaking...</div>
        
        <div id="viewport-container" onclick="handleCanvasClick(event)">
            <!-- WebRTC Live Video Feed -->
            <video id="live-stream" autoplay playsinline muted></video>
        </div>

        <div id="input-panel">
            <input type="text" id="text-input" placeholder="Type instructions here..." onkeydown="if(event.key==='Enter') sendText()" disabled />
            <button class="btn-send" onclick="sendText()" disabled>Send</button>
            <button class="btn-clear" onclick="clearCanvas()" disabled>Clear</button>
            <button class="btn-end" onclick="endCall()" disabled>End Call</button>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const textInput = document.getElementById('text-input');
        const buttons = document.querySelectorAll('button');
        
        let peer = null;
        let dataConnection = null;
        let activeMediaCall = null;
        const targetPeerId = 'chouf-wearable-device';

        function initPeer() {
            if (typeof Peer === 'undefined') {
                statusEl.innerText = "Error: PeerJS library failed to load.";
                return;
            }

            peer = new Peer('chouf-remote-expert', {
                debug: 1,
                secure: true
            });

            peer.on('open', (id) => {
                console.log("Registered as Expert Portal with ID:", id);
                statusEl.innerText = "Portal Ready. Waiting for call from wearable...";
            });

            // Handle incoming Data Connection if wearable initiates it
            peer.on('connection', (conn) => {
                dataConnection = conn;
                console.log("DataConnection received from wearable!");
                setupDataConnection(conn);
            });

            // Handle incoming Video Call from Wearable
            peer.on('call', (call) => {
                activeMediaCall = call;
                console.log("Incoming video stream call from wearable...");
                call.answer();

                call.on('stream', (remoteStream) => {
                    console.log("Rendering live video stream from wearable!");
                    const video = document.getElementById('live-stream');
                    video.srcObject = remoteStream;
                    video.play().catch(e => console.error("Video play error:", e));
                    
                    statusEl.innerText = "Direct Stream Active! Connected to Wearable.";
                    enableControls();

                    // Connect DataChannel to wearable if not already open
                    if (!dataConnection || !dataConnection.open) {
                        console.log("Connecting P2P DataChannel to wearable...");
                        const conn = peer.connect(targetPeerId);
                        setupDataConnection(conn);
                    }
                });
            });
        }

        function setupDataConnection(conn) {
            dataConnection = conn;
            conn.on('open', () => {
                console.log("P2P DataChannel open and ready for commands!");
                statusEl.innerText = "Direct P2P Link Active! Connected to Wearable.";
                enableControls();
            });

            conn.on('close', () => {
                console.warn("DataChannel closed.");
                disableControls();
            });

            conn.on('error', (err) => {
                console.error("DataConnection error:", err);
            });
        }

        window.addEventListener('load', initPeer);

        function enableControls() {
            textInput.removeAttribute('disabled');
            buttons.forEach(btn => btn.removeAttribute('disabled'));
        }

        function disableControls() {
            textInput.setAttribute('disabled', 'true');
            buttons.forEach(btn => btn.setAttribute('disabled', 'true'));
        }

        function sendCommand(payload) {
            if (dataConnection && dataConnection.open) {
                console.log("Sending P2P command:", payload);
                dataConnection.send(JSON.stringify(payload));
            } else {
                console.warn("P2P DataChannel is not open yet.");
            }
        }

        function handleCanvasClick(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            // Map click position on 640x360 container to 1280x720 frame coordinates
            const x = Math.round(((e.clientX - rect.left) / rect.width) * 1280);
            const y = Math.round(((e.clientY - rect.top) / rect.height) * 720);
            
            console.log(`Canvas clicked at (${x}, ${y})`);
            sendCommand({ type: 'draw_circle', x: x, y: y });
        }

        function sendText() {
            const text = textInput.value.trim();
            if (text) {
                console.log("Sending subtitle text:", text);
                sendCommand({ type: 'text', payload: text });
                textInput.value = '';
            }
        }

        function clearCanvas() {
            sendCommand({ type: 'clear' });
        }

        function endCall() {
            if (dataConnection) dataConnection.close();
            if (activeMediaCall) activeMediaCall.close();
            const video = document.getElementById('live-stream');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            statusEl.innerText = "Call ended by expert.";
            disableControls();
        }
    </script>
</body>
</html>
